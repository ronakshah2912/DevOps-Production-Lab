name: Terraform Dev Validation and Apply

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform-aws-platform/**"
      - ".github/workflows/terraform-dev.yml"
      - ".tflint.hcl"
      - ".checkov.yml"

  push:
    branches:
      - main
    paths:
      - "terraform-aws-platform/**"
      - ".github/workflows/terraform-dev.yml"
      - ".tflint.hcl"
      - ".checkov.yml"

permissions:
  contents: read

env:
  AWS_REGION: ca-central-1
  TF_WORKING_DIR: terraform-aws-platform/environments/dev

jobs:
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Initialize TFLint
        run: tflint --init
        working-directory: .

      - name: Run TFLint
        run: tflint --recursive
        working-directory: .

      - name: Run Checkov security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform-aws-platform
          framework: terraform
          config_file: .checkov.yml
          soft_fail: false

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Upload Terraform plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-dev-plan
          path: terraform-aws-platform/environments/dev/tfplan

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-validate

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: dev-approval

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Download Terraform plan artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-dev-plan
          path: terraform-aws-platform/environments/dev

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan