---
# Source: devops-sample-app/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: "devops-sample-app-prod-devops-sample-app"
  labels:
    app.kubernetes.io/name: devops-sample-app
    app.kubernetes.io/instance: devops-sample-app-prod
    app.kubernetes.io/managed-by: Helm
    environment: "prod"

spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: devops-sample-app
    app.kubernetes.io/instance: devops-sample-app-prod
---
# Source: devops-sample-app/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "devops-sample-app-prod-devops-sample-app"
  labels:
    app.kubernetes.io/name: devops-sample-app
    app.kubernetes.io/instance: devops-sample-app-prod
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    environment: "prod"

spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-sample-app
      app.kubernetes.io/instance: devops-sample-app-prod
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devops-sample-app
        app.kubernetes.io/instance: devops-sample-app-prod
        app.kubernetes.io/version: "1.0.0"
        environment: "prod"
        project: "devops-production-lab"
        managedBy: "helm"
    spec:
      containers:
        - name: "devops-sample-app"
          image: "devops-sample-app:prod"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: APP_NAME
              value: "devops-production-lab"
            - name: APP_ENV
              value: "prod"
            - name: APP_VERSION
              value: "1.0.0"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "750m"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
# Source: devops-sample-app/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-sample-app-prod-devops-sample-app
  labels:
    app.kubernetes.io/name: devops-sample-app
    app.kubernetes.io/instance: devops-sample-app-prod
    app.kubernetes.io/managed-by: Helm
    environment: "prod"
spec:
  ingressClassName: nginx
  rules:
    - host: prod.devops-lab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-sample-app-prod-devops-sample-app
                port:
                  number: 80
