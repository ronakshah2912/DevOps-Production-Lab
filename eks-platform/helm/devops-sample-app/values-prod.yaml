replicaCount: 3

image:
  repository: devops-sample-app
  tag: prod
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  host: prod.devops-lab.local
  path: /
  pathType: Prefix

env:
  APP_NAME: devops-production-lab
  APP_ENV: prod
  APP_VERSION: "1.0.0"
  LOG_LEVEL: INFO

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 750m
    memory: 512Mi

probes:
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3

podLabels:
  project: devops-production-lab
  environment: prod
  managedBy: helm